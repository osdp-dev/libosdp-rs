name: Publish libosdp-sys

on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'libosdp-sys-v*'

jobs:
  release_gate:
    name: Verify tag signature and release metadata
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Verify tag is signed by the release key
      if: github.ref_type == 'tag'
      shell: bash
      env:
        # Primary key of the release identity. Signatures are accepted from any
        # valid subkey it certifies, so a routine subkey rotation needs no
        # change here or in any other repository.
        RELEASE_KEY: D8861B9C6B9C4284D980D6016804DFEE281234B2
      run: |
        set -euo pipefail
        GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
        curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
          https://github.com/sidcha.gpg | gpg --batch --import
        # The key URL serves every key the account publishes, so importing it is
        # not a gate on its own. gpg names the certifying primary key in the last
        # field of VALIDSIG -- require that to be RELEASE_KEY. Also require
        # GOODSIG, which gpg withholds (in favour of EXPKEYSIG or REVKEYSIG) when
        # the signing key is expired or revoked.
        status="$(git -c gpg.program=gpg verify-tag --raw "${GITHUB_REF_NAME}" 2>&1 || true)"
        printf '%s\n' "${status}"
        primary="$(awk '/^\[GNUPG:\] VALIDSIG /{print $NF}' <<<"${status}")"
        if ! grep -q "^\[GNUPG:\] GOODSIG " <<<"${status}" \
           || [ "${primary}" != "${RELEASE_KEY}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} is not signed by the release key"
          exit 1
        fi
        echo "Tag ${GITHUB_REF_NAME} signature verified"
    - name: Check libosdp-sys release metadata
      shell: bash
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if [ "$REF_TYPE" != "tag" ]; then
          echo "Not a tag ref; validating the changelog directory only"
          python3 scripts/make_release.py check-changelog
          exit 0
        fi
        python3 scripts/make_release.py check-release \
          -c libosdp-sys --tag "$REF_NAME" --registry

  bindings_match:
    name: Verify checked-in bindings
    needs: [release_gate]
    runs-on: ubuntu-latest
    env:
      CCACHE_DISABLE: "1"
      LIBOSDP_SYS_REGENERATE_BINDINGS: "1"
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      with:
        toolchain: stable
    - name: Regenerate bindings
      run: cargo build -p libosdp-sys
    - name: Check bindings are committed
      run: git diff --exit-code -- libosdp-sys/src/bindings.rs

  cross_platform_check:
    name: Build crate on ${{ matrix.os }}
    needs: [release_gate, bindings_match]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      with:
        toolchain: stable
    - run: cargo build -p libosdp-sys

  publish:
    name: Publish Crate
    needs: [release_gate, bindings_match, cross_platform_check]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      with:
        toolchain: stable
    - name: Check semver
      continue-on-error: true
      uses: obi1kenobi/cargo-semver-checks-action@v2
      with:
        package: libosdp-sys
    - name: "Publish crate"
      run: |
        cargo publish -p libosdp-sys
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github_release:
    name: Create GitHub release
    # Only after the crate is actually on crates.io: a release announcing a
    # version that failed to publish would point at nothing installable.
    needs: [publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Render release notes from the changelog
      id: notes
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        python3 scripts/changelog_tool.py notes \
          --file "changelog/${REF_NAME}.md" --output RELEASE.txt
        test -s RELEASE.txt
        # Releases are titled "<crate> v<version>" rather than the raw tag, so
        # the crate reads as a name and not as part of a hyphenated string.
        echo "title=${REF_NAME%-v*} ${REF_NAME##*-}" >> "$GITHUB_OUTPUT"
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ steps.notes.outputs.title }}
        body_path: RELEASE.txt
        draft: false
        prerelease: false
