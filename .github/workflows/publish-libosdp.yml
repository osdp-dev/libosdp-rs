name: Publish libosdp

on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'libosdp-v*'

jobs:
  release_gate:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Check libosdp release metadata
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        args=(-c libosdp -r)
        if [ "$REF_TYPE" = "tag" ]; then
          args+=(-t "$REF_NAME")
        fi
        bash scripts/check-release.sh "${args[@]}"

  cross_platform_check:
    name: Build crate on ${{ matrix.os }}
    needs: [release_gate]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      with:
        toolchain: stable
        override: true
    - run: cargo build -p libosdp

  publish:
    name: Publish Crate
    needs: [release_gate, cross_platform_check]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      with:
        toolchain: stable
        override: true
    - name: Check semver
      continue-on-error: true
      uses: obi1kenobi/cargo-semver-checks-action@v2
      with:
        package: libosdp
    - name: "Publish crate"
      run: |
        cargo publish -p libosdp
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
