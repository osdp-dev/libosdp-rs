[package]
edition = "2021"
rust-version = "1.85"
name = "libosdp"
version = "1.0.0-dev"
authors = ["Siddharth Chandrasekaran <sidcha.dev@gmail.com>"]
description = "Library implementation of IEC 60839-11-5 OSDP (Open Supervised Device Protocol)"
documentation = "https://docs.rs/libosdp"
homepage = "https://doc.osdp.dev/"
readme = "README.md"
repository = "https://github.com/osdp-dev/libosdp-rs"
license = "Apache-2.0"
keywords = ["osdp", "libosdp", "acs", "sia", "wiegand"]
categories = ["development-tools", "embedded"]

[dependencies]
bitflags = "2.10.0"
embedded-io = { version = "0.7.1", features = ["alloc"] }
libosdp-sys = "=4.0.0-dev"
log = { version = "0.4.29", optional = true }
serde = { version = "1.0.228", features = ["derive", "alloc"], default-features = false, optional = true }
thiserror = { version = "2.0.18", optional = true }
defmt = { version = "1.0", optional = true, features = ["alloc"] }
itoa = "1.0.17"

[dev-dependencies]
env_logger = "0.11.8"
multiqueue = "0.3.2"
rand = "0.10.1"
ringbuf = "0.5.0"
sha256 = "1.6.0"

[features]
default = ["std"]
defmt = ["embedded-io/defmt", "dep:defmt"]
log = ["dep:log"]
serde = ["dep:serde", "bitflags/serde"]
std = ["thiserror", "serde?/std", "log", "log/std"]
trs = ["libosdp-sys/trs"]

[[example]]
name = "cp"
required-features = ["std"]

[[example]]
name = "pd"
required-features = ["std"]
