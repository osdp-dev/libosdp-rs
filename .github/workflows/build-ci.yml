name: Build CI

on:
  push:
    branches: [ master, 'release_v*' ]
  pull_request:
    branches: [ master, 'release_v*' ]

jobs:
  changelog:
    name: Validate release changelogs
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Validate every published release file
        run: python3 scripts/make_release.py check-changelog
      - name: Release tool unit tests
        run: python3 -m unittest discover -s scripts/tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          target: thumbv6m-none-eabi
      - name: Cargo check
        run: cargo check
      - name: Test with serde
        run: cargo test --package libosdp --features serde --lib
      - name: Install gcc-arm-none-eabi
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Cargo check no-std
        run: cargo check --package libosdp --target thumbv6m-none-eabi --no-default-features
      - name: Cargo check no-std with defmt
        run: cargo check --package libosdp --target thumbv6m-none-eabi --no-default-features --features defmt
      - name: Cargo check no-std with async
        run: cargo check --package libosdp --target thumbv6m-none-eabi --no-default-features --features async
      - name: Cargo check TRS
        run: cargo check --package libosdp-sys --features trs
      - name: Cargo check TRS no-std
        run: cargo check --package libosdp-sys --target thumbv6m-none-eabi --features trs

  bindings-check:
    name: Regenerate bindings and check on ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, thumbv6m-none-eabi]
    env:
      LIBOSDP_SYS_REGENERATE_BINDINGS: "1"
      LIBOSDP_SYS_BINDGEN_LAYOUT_TESTS: "1"
      CCACHE_DISABLE: "1"
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Install gcc-arm-none-eabi
        if: matrix.target == 'thumbv6m-none-eabi'
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Regenerate bindings and cargo check
        run: cargo check -p libosdp-sys --target ${{ matrix.target }}
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
      - name: Cargo test
        run: cargo test
      - name: Cargo test TRS
        run: cargo test --package libosdp --features trs
      - name: Cargo test async
        run: cargo test --package libosdp --features async
      - name: Build the async examples
        run: cargo build --package libosdp --features async --examples

  valgrind:
    name: Integration tests under valgrind
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: >-
        valgrind --error-exitcode=1 --leak-check=full
        --errors-for-leak-kinds=definite --track-origins=yes
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Library and single-threaded integration tests
        run: >-
          cargo test --package libosdp --features async
          --lib --test ownership --test api --test async
